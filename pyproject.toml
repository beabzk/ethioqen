[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ethioqen"
version = "0.2.2"
description = "A package for Ethiopian date and time conversions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}
authors = [
    {name = "Beabfekad Zikie", email = "beabzk@proton.me"}
]
classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Localization",
]

[project.urls]
"Bug Reports" = "https://github.com/beabzk/ethioqen/issues"
"Source" = "https://github.com/beabzk/ethioqen"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "bump-my-version>=0.31",
]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=3",
]

[tool.uv]
required-version = ">=0.8"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# N806: single-letter vars are conventional in the JDN algorithm;
# revisited when _jdn_to_gregorian is rewritten.
"ethioqen/calendar_conversion.py" = ["N806"]
# N818: renaming exceptions is a breaking API change.
"ethioqen/exceptions.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["ethioqen", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ethioqen --cov-report=term-missing"

[tool.bumpversion]
current_version = "0.2.2"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "ethioqen/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'