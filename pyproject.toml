[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ethioqen"
version = "0.2.1"
description = "A package for Ethiopian date and time conversions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}
authors = [
    {name = "Beabfekad Zikie", email = "beabzk@proton.me"}
]
classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Localization",
]

[project.urls]
"Bug Reports" = "https://github.com/beabzk/ethioqen/issues"
"Source" = "https://github.com/beabzk/ethioqen"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "bump-my-version>=0.31",
]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=3",
]

[tool.uv]
required-version = ">=0.8"